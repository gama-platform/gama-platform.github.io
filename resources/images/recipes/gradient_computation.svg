<line x1="80" y1="766" x2="1520" y2="766" stroke="#d7e0e8" stroke-width="2"/>
<text x="80" y="806" class="section">How each step updates the grid</text>
<rect x="120" y="830" width="380" height="164" rx="12" class="process"/>
<text x="310" y="878" text-anchor="middle" class="stage">1 · Start</text>
<text x="310" y="918" text-anchor="middle" class="note">Read the current values</text>
<text x="310" y="942" text-anchor="middle" class="note">from every grid cell.</text>
<rect x="610" y="830" width="380" height="164" rx="12" class="process"/>
<text x="800" y="878" text-anchor="middle" class="stage">2 · Apply kernel</text>
<text x="800" y="918" text-anchor="middle" class="note">Multiply each source value</text>
<text x="800" y="942" text-anchor="middle" class="note">by the matching kernel weights.</text>
<rect x="1100" y="830" width="380" height="164" rx="12" class="process"/>
<text x="1290" y="878" text-anchor="middle" class="stage">3 · Combine</text>
<text x="1290" y="918" text-anchor="middle" class="note">Keep the greatest contribution at each cell</text>
<path class="arrow" d="M 510 912 L 590 912"/>
<path class="arrow" d="M 1000 912 L 1080 912"/>
<text x="800" y="1030" text-anchor="middle" class="note">The upper row shows the kernel and the resulting grid states; the lower row summarizes the operation.</text>
</svg>
