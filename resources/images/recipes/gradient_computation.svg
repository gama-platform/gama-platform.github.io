<text x="1428.0" y="528.0" text-anchor="middle" class="cell" font-size="19">1/64</text>
<text x="1172.0" y="566.0" text-anchor="middle" class="cell" font-size="19">1/64</text>
<text x="1236.0" y="566.0" text-anchor="middle" class="cell" font-size="19">1/8</text>
<text x="1300.0" y="566.0" text-anchor="middle" class="cell" font-size="19">1</text>
<text x="1364.0" y="566.0" text-anchor="middle" class="cell" font-size="19">1/8</text>
<text x="1428.0" y="566.0" text-anchor="middle" class="cell" font-size="19">1/64</text>
<text x="1172.0" y="604.0" text-anchor="middle" class="cell" font-size="19">1/64</text>
<text x="1236.0" y="604.0" text-anchor="middle" class="cell" font-size="19">1/8</text>
<text x="1300.0" y="604.0" text-anchor="middle" class="cell" font-size="19">1/8</text>
<text x="1364.0" y="604.0" text-anchor="middle" class="cell" font-size="19">1/8</text>
<text x="1428.0" y="604.0" text-anchor="middle" class="cell" font-size="19">1/64</text>
<text x="1172.0" y="642.0" text-anchor="middle" class="cell" font-size="19">1/64</text>
